<!doctype html>
<html lang="it" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03091B" />
    <meta name="google" content="notranslate" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Lemons Training</title>
    <link rel="preload" href="/fonts/RecoletaAlt-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #03091B;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.4s ease;
      }
      #splash.fade { opacity: 0; pointer-events: none; }
      #splash img { width: 72px; height: 72px; object-fit: contain; animation: splashPulse 1.6s ease-in-out infinite; }
      @keyframes splashPulse {
        0%, 100% { opacity: 0.5; transform: scale(0.92); }
        50%       { opacity: 1;   transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/immersive/logo-mark.webp" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.__hideSplash = function() {
        var s = document.getElementById('splash');
        if (!s) return;
        s.classList.add('fade');
        setTimeout(function() { s.remove(); }, 450);
      };
    </script>
  </body>
</html>
